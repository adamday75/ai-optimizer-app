<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      color-scheme: light;
    }
    body {
      width: 320px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      background: #ffffff;
      color: #1f2937;
    }
    .shell {
      padding: 0;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 18px 18px 16px;
      text-align: center;
    }
    .brand-lockup {
      width: min(100%, 220px);
      height: auto;
      display: block;
      margin: 0 auto 8px;
    }
    .subtitle {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.94);
    }
    .content {
      padding: 14px 16px 16px;
    }
    .status {
      padding: 11px 12px;
      margin: 0 0 12px 0;
      border-radius: 8px;
      font-weight: 700;
      text-align: center;
    }
    .status.running {
      background: #dff5e6;
      color: #166534;
    }
    .status.stopped {
      background: #fde2e2;
      color: #991b1b;
    }
    .stats {
      border: 1px solid #ececf3;
      border-radius: 10px;
      overflow: hidden;
      background: #ffffff;
    }
    .stat {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      border-bottom: 1px solid #eee;
    }
    .stat:last-child {
      border-bottom: none;
    }
    .stat-label {
      color: #6b7280;
      font-weight: 500;
    }
    .stat-value {
      font-weight: 700;
      color: #1f2937;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="header">
      <img class="brand-lockup" src="assets/ai-optimizer-logo-horizontal-lockup.png" alt="AI Optimizer">
      <p class="subtitle">Local-first AI caching</p>
    </div>

    <div class="content">
      <div id="status" class="status stopped">Checking...</div>

      <div class="stats">
        <div class="stat">
          <span class="stat-label">Requests</span>
          <span class="stat-value" id="requests">-</span>
        </div>
        <div class="stat">
          <span class="stat-label">Cache Hits</span>
          <span class="stat-value" id="cache-hits">-</span>
        </div>
        <div class="stat">
          <span class="stat-label">Hit Rate</span>
          <span class="stat-value" id="hit-rate">-</span>
        </div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
